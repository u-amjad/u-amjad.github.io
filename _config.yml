# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Intelligent Computing & Vision Research Group
email: usmanamjad@neduet.edu.pk
description: > # this means to ignore newlines until "baseurl:"
  Research lab at NED University of Engineering & Technology, Karachi, working on
  AI and machine learning for brain imaging, biomedical image processing, and
  bioinformatics.
baseurl: ""
url: "https://usmanamjad.github.io"

include:
  - .htaccess
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links